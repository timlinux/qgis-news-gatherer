name: Monthly report

on:
  # Cron cannot express "last Thursday", so this fires every day in the last
  # stretch of the month and the gate job below decides whether today is
  # actually the last Thursday.
  schedule:
    - cron: '0 6 22-31 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to generate, as YYYY-MM (default: current month)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  gate:
    name: Is today the last Thursday?
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check the date
        id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Triggered manually - proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Thursday is 4, and it is the last one when a week from today
          # lands in a different month.
          weekday="$(date -u +%u)"
          this_month="$(date -u +%m)"
          next_week_month="$(date -u -d '+7 days' +%m)"
          if [ "$weekday" = "4" ] && [ "$this_month" != "$next_week_month" ]; then
            echo "$(date -u +%Y-%m-%d) is the last Thursday - proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "$(date -u +%Y-%m-%d) is not the last Thursday - skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  report:
    name: Gather and publish
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the target month
        id: month
        run: |
          set -euo pipefail
          month="${{ inputs.month }}"
          if [ -z "$month" ]; then
            month="$(date -u +%Y-%m)"
          fi
          if ! printf '%s' "$month" | grep -Eq '^[0-9]{4}-[0-9]{2}$'; then
            echo "::error::Month must look like YYYY-MM, got '$month'"
            exit 1
          fi
          echo "month=$month" >> "$GITHUB_OUTPUT"
          echo "Generating the report for $month"

      # The flake pins WeasyPrint and the Noto font set, so the published PDF
      # matches what maintainers build locally.
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Carries youtube_history.json between runs, which is what makes the
      # month-on-month YouTube chart possible.
      - name: Restore the gatherer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/qgis-news-gatherer
          key: gatherer-cache-${{ steps.month.outputs.month }}-${{ github.run_id }}
          restore-keys: |
            gatherer-cache-${{ steps.month.outputs.month }}-
            gatherer-cache-

      - name: Generate the report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSIFEX_TOKEN: ${{ secrets.TRANSIFEX_TOKEN }}
        run: |
          set -euo pipefail
          nix run .#report-pdf "${{ steps.month.outputs.month }}"
          ls -la qgis-news-*.pdf

      - name: Stage the report for publication
        run: |
          set -euo pipefail
          month="${{ steps.month.outputs.month }}"
          mkdir -p docs/reports
          cp "qgis-news-$month.pdf" "docs/reports/qgis-news-$month.pdf"

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: qgis-news-${{ steps.month.outputs.month }}
          path: qgis-news-${{ steps.month.outputs.month }}.pdf
          retention-days: 90

      - name: Publish the site with the new report
        uses: ./.github/actions/publish-site
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          month="${{ steps.month.outputs.month }}"
          {
            echo "## QGIS news report for $month"
            echo
            echo "Published to the [report archive](https://timlinux.github.io/qgis-news-gatherer/reports/)."
            echo
            echo "- [Direct PDF](https://timlinux.github.io/qgis-news-gatherer/reports/qgis-news-$month.pdf)"
          } >> "$GITHUB_STEP_SUMMARY"
