site_name: QGIS News Gatherer
site_description: >
  Automated content collection for the QGIS monthly news segment - collects
  project activity from every QGIS source and renders it as show notes.
site_url: https://timlinux.github.io/qgis-news-gatherer/
site_author: Kartoza
copyright: >
  &copy; Kartoza — Made with 💗 by
  <a href="https://kartoza.com">Kartoza</a>
  &middot; <a href="https://github.com/sponsors/kartoza">Donate</a>
  &middot; <a href="https://github.com/timlinux/qgis-news-gatherer">GitHub</a>

repo_url: https://github.com/timlinux/qgis-news-gatherer
repo_name: timlinux/qgis-news-gatherer
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/brand/qgis-logo.svg
  favicon: assets/brand/favicon.png
  font:
    text: Nunito
    code: JetBrains Mono
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/file-edit-outline
    view: material/eye-outline

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/timlinux/qgis-news-gatherer
      name: GitHub repository
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/kartoza
      name: Sponsor on GitHub
  generator: false

extra_css:
  - stylesheets/kartoza-tokens.css
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: {case: lower}
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: en

nav:
  - Home: index.md
  - Reports: reports/index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Your First Report: getting-started/first-report.md
  - User Guide:
    - user-guide/index.md
    - Command Line: user-guide/cli.md
    - Sections: user-guide/sections.md
    - Output Formats: user-guide/output-formats.md
    - YouTube Sections: user-guide/youtube.md
  - Administrator Guide:
    - admin-guide/index.md
    - Configuration: admin-guide/configuration.md
    - Monthly Automation: admin-guide/automation.md
  - Developer Guide:
    - developer-guide/index.md
    - Project Structure: developer-guide/project-structure.md
    - Writing a Collector: developer-guide/collectors.md
    - Testing: developer-guide/testing.md
    - Contributing: developer-guide/contributing.md
  - About:
    - about/index.md
    - Specification: about/specification.md
    - Changelog: about/changelog.md
